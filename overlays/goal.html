<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>LiveDeck Goal</title>
  <link rel="stylesheet" href="ld-broadcast.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; }

    .goal {
      --c: #a77bff;                 /* لون بداية التدرّج */
      --c2: #f39ce6;                /* لون نهاية التدرّج */
      --num: color-mix(in srgb, var(--c2) 55%, #fff);
      font-family: var(--font);
      color: #fff;
      direction: ltr;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      column-gap: 14px;
      row-gap: 10px;
      align-items: center;
      width: min(640px, 96vw);
      box-sizing: border-box;
      padding: 14px 20px 16px 14px;
      border-radius: 14px;
      position: relative;
    }

    /* ===== الخلفيات ===== */
    .bg-dark { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .bg-glass { background: rgba(245, 246, 250, .92); border: 1px solid rgba(255, 255, 255, .6); box-shadow: var(--shadow); color: #13151b; --num: color-mix(in srgb, var(--c) 70%, #000); }
    .bg-glass .label { color: rgba(19, 21, 27, .6); }
    .bg-glass .track { background: rgba(19, 21, 27, .1); }
    .bg-glass .icon { background: color-mix(in srgb, var(--c) 14%, #fff); }
    .bg-none { background: none; box-shadow: none; }
    .bg-none .label, .bg-none .nums { text-shadow: 0 1px 2px rgba(0, 0, 0, .85), 0 0 10px rgba(0, 0, 0, .45); }
    .bg-none .label { color: rgba(255, 255, 255, .85); }
    .bg-none .track { background: rgba(10, 11, 14, .6); }

    /* ===== الأيقونة ===== */
    .icon {
      grid-row: 1 / span 2;
      width: 40px; height: 40px; border-radius: 11px;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--c) 20%, rgba(255, 255, 255, .04));
      color: color-mix(in srgb, var(--c) 45%, #fff);
    }
    .bg-glass .icon { color: color-mix(in srgb, var(--c) 80%, #000); }
    .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== النص ===== */
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; min-width: 0; }
    .label { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label.ar { letter-spacing: 0; font-size: 15px; font-family: var(--font-ar); }
    .nums { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; }
    .cur { color: var(--num); }
    .rest { opacity: .5; font-weight: 700; }

    /* ===== الشريط ===== */
    .track { position: relative; height: 12px; border-radius: 999px; background: rgba(255, 255, 255, .09); overflow: hidden; }
    /* العرض/الارتفاع بدل transform حتى تبقى الأطراف مستديرة عند القيم الصغيرة */
    .fill {
      --p: 0;
      position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px;
      width: max(12px, calc(100% * var(--p)));
      background: linear-gradient(90deg, var(--c), var(--c2));
      transition: width .9s cubic-bezier(.2, 1, .3, 1), height .9s cubic-bezier(.2, 1, .3, 1);
    }
    /* لمعة تمر على الشريط */
    .fill::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent 0 35%, rgba(255, 255, 255, .35) 50%, transparent 65%) -150% 0 / 60% 100% no-repeat; animation: sweep 3.5s ease-in-out infinite; }
    @keyframes sweep { 0% { background-position: -150% 0; } 60%, 100% { background-position: 250% 0; } }

    .goal.flip { direction: rtl; }
    .goal.flip .fill { left: auto; right: 0; background: linear-gradient(270deg, var(--c), var(--c2)); }
    .goal.done .fill::after { animation-duration: 1.4s; }
    .goal.done .icon { background: var(--c); color: #fff; }

    /* ===== العمودي ===== */
    .goal.v {
      width: auto; height: min(560px, 96vh);
      grid-template-columns: auto auto; grid-template-rows: auto 1fr;
      column-gap: 12px; row-gap: 14px;
      padding: 16px 16px 18px; justify-items: center;
    }
    .goal.v .icon { grid-row: 1; grid-column: 1 / span 2; }
    .goal.v .head {
      grid-row: 2; grid-column: 1; align-self: stretch;
      writing-mode: vertical-rl; transform: rotate(180deg);
      flex-direction: row; justify-content: space-between; align-items: center;
    }
    .goal.v .label { max-height: 55%; }
    .goal.v .track { grid-row: 2; grid-column: 2; width: 14px; height: auto; align-self: stretch; }
    .goal.v .fill { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: max(12px, calc(100% * var(--p))); background: linear-gradient(0deg, var(--c), var(--c2)); }
    .goal.v .fill::after { animation: none; }
    .goal.v.flip { direction: ltr; }
    .goal.v.flip .head { grid-column: 2; }
    .goal.v.flip .track { grid-column: 1; }
  </style>
</head>
<body>
  <div id="stage">
    <div class="goal bg-dark" id="goal">
      <div class="icon" id="icon"></div>
      <div class="head">
        <span class="label" id="title">GOAL</span>
        <span class="nums"><span class="cur" id="cur">0</span><span class="rest"> / <span id="target">0</span></span></span>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </div>
  <script src="overlay.js"></script>
  <script>
    (function () {
      const { fmt, params } = Overlay;
      const $ = (id) => document.getElementById(id);
      // أيقونات خطية (مرسومة بخطوط رفيعة مثل الصورة)
      const ICONS = {
        followers: '<circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/>',
        likes: '<path d="M12 20s-7-4.3-9-8.6C1.6 8.3 3.4 5 6.6 5c2 0 3.2 1.2 3.9 2.2h3c.7-1 1.9-2.2 3.9-2.2 3.2 0 5 3.3 3.6 6.4C19 15.7 12 20 12 20z"/>',
        diamonds: '<path d="M6 4h12l3 5-9 11L3 9z"/><path d="M3 9h18M9 4l3 16 3-16"/>',
      };
      let goal = { kind: 'likes', target: 1000, title: 'هدف اللايكات', color: '#a77bff', color2: '#f39ce6', panel: 'dark', orient: 'h', flip: false };
      let stats = {};

      function draw() {
        const v = Number(stats[goal.kind]) || 0;
        const t = Math.max(1, Number(goal.target) || 1);
        const p = Math.min(1, v / t);
        // ?orient=v في الرابط يتجاوز الإعداد (لاستخدام شريطين باتجاهين مختلفين)
        const vertical = (params.get('orient') || goal.orient) === 'v';
        const box = $('goal');
        box.className = `goal bg-${goal.panel || 'dark'}` + (vertical ? ' v' : '') + (goal.flip ? ' flip' : '') + (p >= 1 ? ' done' : '');
        box.style.setProperty('--c', goal.color || '#a77bff');
        box.style.setProperty('--c2', goal.color2 || goal.color || '#f39ce6');
        $('icon').innerHTML = `<svg viewBox="0 0 24 24">${ICONS[goal.kind] || ICONS.likes}</svg>`;
        $('title').textContent = goal.title || '';
        $('title').classList.toggle('ar', /[؀-ۿ]/.test(goal.title || ''));
        $('cur').textContent = fmt(v);
        $('target').textContent = fmt(t);
        $('fill').style.setProperty('--p', p);
      }

      Overlay
        .on('snapshot', (s) => { goal = { ...goal, ...(s.goal || {}) }; stats = s.stats || stats; draw(); })
        .on('config', (c) => { if (c.goal) { goal = { ...goal, ...c.goal }; draw(); } })
        .on('stats', (s) => { stats = s; draw(); });
    })();
  </script>
</body>
</html>
