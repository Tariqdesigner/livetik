<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>LiveDeck Now Playing</title>
  <link rel="stylesheet" href="ld-broadcast.css" />
  <style>
    .card { display: none; margin: 12px; padding: 10px 16px 10px 10px; gap: 14px; align-items: center; max-width: min(520px, calc(100vw - 24px)); position: relative; overflow: hidden; }
    .card.show { display: flex; animation: ld-in-side .5s var(--ease) both; }
    .art { position: relative; width: 64px; height: 64px; flex-shrink: 0; border-radius: 10px; overflow: hidden; background: #23252d; }
    .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .art img[src=""] { visibility: hidden; }
    /* أعمدة صوت متحركة فوق الصورة */
    .eq { position: absolute; inset-inline-start: 6px; bottom: 6px; display: flex; gap: 2px; align-items: flex-end; height: 14px; padding: 2px 3px; border-radius: 4px; background: rgba(0, 0, 0, .55); }
    .eq i { width: 3px; border-radius: 1px; background: #fff; animation: eq 1s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: -.3s; }
    .eq i:nth-child(3) { animation-delay: -.6s; }
    @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }
    .info { flex: 1; min-width: 0; }
    .kick { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: color-mix(in srgb, var(--c) 60%, #fff); text-transform: uppercase; }
    .title { font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; text-align: start; margin-top: 1px; }
    .meta { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-ar); font-size: 12.5px; color: var(--dim); margin-top: 2px; }
    .meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .08); }
    .fill { height: 100%; width: 0; background: var(--c); transition: width 1s linear; }
    [dir="rtl"] .fill { margin-inline-start: auto; }
  </style>
</head>
<body>
  <div class="card ld-panel" id="card">
    <div class="art"><img id="thumb" alt="" src="" /><div class="eq"><i></i><i></i><i></i></div></div>
    <div class="info">
      <div class="kick">Now playing</div>
      <div class="title" id="title"></div>
      <div class="meta"><span id="by"></span><span id="next"></span></div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <script src="overlay.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      let duration = 0;
      function draw(st) {
        if (!st) return;
        const c = st.current;
        $('card').classList.toggle('show', Boolean(c));
        if (!c) return;
        $('thumb').src = c.thumbnail || '';
        $('title').textContent = c.title;
        $('by').textContent = c.requestedBy ? 'طلب: ' + (c.requestedBy.nickname || c.requestedBy.uniqueId) : '';
        $('next').textContent = st.queue && st.queue.length ? `التالي: ${st.queue[0].title}` + (st.queue.length > 1 ? ` (+${st.queue.length - 1})` : '') : '';
        duration = st.duration || c.duration || 0;
      }
      Overlay
        .on('snapshot', (s) => draw(s.music))
        .on('music', draw)
        .on('music-progress', (p) => { const d = p.duration || duration; $('fill').style.width = d ? Math.min(100, (p.position / d) * 100) + '%' : '0'; });
    })();
  </script>
</body>
</html>
