<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>LiveDeck — آخر الأحداث</title>
  <link rel="stylesheet" href="latest-fonts.css" />
  <link rel="stylesheet" href="widget-frames.css" />
  <link rel="stylesheet" href="latest-widget.css" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #stage { position: absolute; inset: 0; display: grid; place-items: center; }
    /* متمركز بالضبط: لو الويدجت أعرض من المصدر ما ينزاح لجهة (التصغير حول المركز) */
    #fit { position: absolute; left: 50%; top: 50%; width: max-content; transform: translate(-50%, -50%); transform-origin: 50% 50%; }
    .wait { color: rgba(255, 255, 255, .55); font: 700 16px 'Tajawal', sans-serif; }
  </style>
</head>
<body>
  <div id="stage"><div id="fit"></div></div>
  <script src="overlay.js"></script>
  <script src="frame-fx.js"></script>
  <script src="latest-render.js"></script>
  <script src="latest.js"></script>
</body>
</html>
