<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>LiveDeck — Alerts</title>
  <link rel="stylesheet" href="fonts/tajawal/800.css" />
  <link rel="stylesheet" href="fonts/outfit/800.css" />
  <link rel="stylesheet" href="widget-frames.css" />
  <link rel="stylesheet" href="action-card.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    #stage { position: fixed; inset: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    video, .vimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    /* عنوان الأليرت: نص أبيض عريض بظل حاد، وخط بلون الأليرت تحته */
    .title {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      font-family: "Outfit", "Tajawal", "Segoe UI", sans-serif; font-weight: 800;
      font-size: var(--fs, 13vmin); line-height: 1.05; letter-spacing: -.02em; white-space: nowrap; text-align: center;
      color: #fff;
      text-shadow: 0 .5vmin 0 color-mix(in srgb, var(--c) 55%, #000), 0 .9vmin 2.4vmin rgba(0, 0, 0, .55);
      unicode-bidi: plaintext; pointer-events: none; z-index: 2;
    }
    .title::after {
      content: ""; position: absolute; left: 50%; bottom: -2.4vmin; width: 32%; height: 1.4vmin; margin-left: -16%;
      border-radius: 1vmin; background: var(--c); box-shadow: 0 .4vmin 1.2vmin rgba(0, 0, 0, .4);
    }
    .title.in { animation: popIn .65s cubic-bezier(.2, .9, .3, 1.15) both; }
    .title.in::after { animation: grow .55s .25s cubic-bezier(.2, .9, .3, 1) both; }
    .title.out { animation: popOut .5s ease-in both; }
    .title.static { animation: none; }
    .title:empty { display: none; }
    video.act, .vimg.act { transition: opacity .4s; }
    .act.gone { opacity: 0; }
    .title.counter { font-size: calc(var(--fs, 13vmin) * 1.6); font-variant-numeric: tabular-nums; }
    .title.counter.bump { animation: bump .18s ease-out; }
    .caption {
      position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
      font: 800 6vmin "Tajawal", "Outfit", sans-serif; color: #fff; white-space: nowrap;
      text-shadow: 0 0 1.5vmin rgba(0,0,0,.9), 0 0.4vmin 0.3vmin #000; unicode-bidi: plaintext;
    }
    @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.85); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    @keyframes popOut { to { opacity: 0; transform: translate(-50%, -58%) scale(1.04); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes bump { 50% { transform: translate(-50%, -50%) scale(1.06); } }
    /* glitch: نسختان ملونتان تنزاحان فوق النص الأبيض */
    .title.glitch { animation: popIn .5s both, jitter 1.2s steps(2) infinite .5s; }
    .title.glitch.static { animation: none; }
    .title.glitch::after { display: none; }
    .title.glitch::before, .title.glitch span { content: attr(data-text); position: absolute; inset: 0; text-shadow: none; }
    .title.glitch::before { color: var(--c2); opacity: .75; animation: gl1 .9s steps(3) infinite; mix-blend-mode: screen; }
    @keyframes gl1 { 0% { clip-path: inset(0 0 70% 0); transform: translate(-1.2vmin, 0); color: var(--c); } 50% { clip-path: inset(40% 0 30% 0); transform: translate(1vmin, 0); color: var(--c2); } 100% { clip-path: inset(80% 0 0 0); transform: translate(-.6vmin, 0); color: var(--c); } }
    @keyframes jitter { 50% { transform: translate(calc(-50% + .4vmin), -50%) skewX(-4deg); } }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="overlay.js"></script>
  <script src="frame-fx.js"></script>
  <script src="action-card.js"></script>
  <script src="valerts.js"></script>
</body>
</html>
